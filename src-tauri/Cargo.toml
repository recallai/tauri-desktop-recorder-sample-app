[package]
name = "recall_tauri_meet_sample"
version = "0.1.0"
edition = "2021"

[lib]
name = "recall_tauri_meet_sample_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
